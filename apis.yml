name: Solu Therapeutics
description: >-
  Solu Therapeutics is a clinical-stage biotechnology company headquartered in Boston,
  Massachusetts, pioneering a novel class of antibody therapeutics that unlock cell-surface
  targets by combining small molecules with effector antibodies through proprietary linker
  technology. Its two platform technologies are CyTAC (Cytotoxicity Targeting Chimera), which
  links cell-surface targets to antibodies that kill pathogenic cells, and TicTAC (Therapeutic
  Index Control Targeting Chimera), which gives long-acting small-molecule agonists and
  antagonists antibody-like pharmacokinetics. Its lead program, STX-0712, is a CyTAC targeting
  the GPCR CCR2 in Phase 1 trials for chronic myelomonocytic leukemia, with additional oncology
  and immunology programs advancing. Solu is a portfolio company of the venture firm DCVC. The
  company operates as a drug-discovery and clinical-development organization and publishes no
  public developer API, developer portal, or programmatic surface.
